workflows:
  android-debug:
    name: Guiling Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Prepare Android SDK
        script: |
          set -eu
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(command -v sdkmanager || true)"
          fi
          if [ ! -x "$SDK_MANAGER" ]; then
            echo "Android SDK manager missing under $ANDROID_HOME/cmdline-tools/latest/bin" >&2
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
          chmod +x gradlew
      - name: Unit tests, lint and APK
        script: |
          set -eu
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify APK signature and checksum
        script: |
          set -eu
          SDK_ROOT="$(sed -n 's/^sdk.dir=//p' local.properties)"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cd app/build/outputs/apk/debug
          shasum -a 256 app-debug.apk > app-debug.apk.sha256
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/apk/debug/*.sha256
      - app/build/outputs/apk/androidTest/debug/*.apk
      - app/build/reports/**
      - app/build/test-results/**/*.xml
